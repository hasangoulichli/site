      const playTone = (freq = 520, duration = 0.05) => {
        if (!soundEnabled) return;
        try {
          if (!audioCtxRef.current) {
            audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          }
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.03, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      };

        setActivePage(pageId);
        setExpandedPost(null);
        playTone(620, 0.05);

                          {pub.summary}
                        </p>
                        {(pub.doi || pub.osf) && (
                          <div className="flex flex-wrap gap-3 pt-2 border-t border-[#2A3447]/60 text-xs font-mono">
                            {pub.doi && (
                              <a href={pub.doi} target="_blank" rel="noreferrer" className="text-emerald hover:underline">
                                <i className="fa-solid fa-arrow-up-right-from-square mr-1"></i>DOI
                              </a>
                            )}
                            {pub.osf && (
                              <a href={pub.osf} target="_blank" rel="noreferrer" className="text-cyan hover:underline">
                                <i className="fa-solid fa-database mr-1"></i>OSF Dataset
                              </a>
                            )}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 3. PROJECTS PAGE */}
              {activePage === 'projects' && (
                <div className="space-y-6">
                  <div className="border-b border-[#2A3447] pb-3 mb-4">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <i className="fa-solid fa-flask text-amber"></i>
                      {lang === 'tr' ? 'Araştırma Projeleri' : 'Research Projects'}
                    </h2>
                  </div>

                  <div className="space-y-4">
                    {t.projectsList.map((proj) => (
                      <div key={proj.id} className="p-5 rounded-xl bg-[#1A202C]/50 border border-[#2A3447] hover:border-amber/50 transition">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                          <span className="px-2.5 py-0.5 rounded bg-amber/20 text-amber font-mono text-xs font-bold border border-amber/40">
                            {proj.status}
                          </span>
                          <span className="text-xs font-mono text-gray-400">{proj.sample}</span>
                        </div>

                        <h3 className="text-base font-bold text-white mb-1">{proj.title}</h3>
                        <p className="text-xs font-mono text-amber/90 mb-2">{proj.role}</p>
                        <p className="text-xs text-gray-300 leading-relaxed mb-3">{proj.desc}</p>

                        <div className="flex flex-wrap gap-1.5">
                          {proj.methods.map((m, i) => (
                            <span key={i} className="px-2 py-0.5 rounded bg-[#090B10] border border-[#2A3447] text-[11px] font-mono text-gray-300">
                              {m}
                            </span>
                          ))}
                        </div>

                        {proj.imageUrl && (
                          <img src={proj.imageUrl} alt={proj.title} className="mt-4 rounded-lg w-full max-h-64 object-cover border border-[#2A3447]" />
                        )}
                        {proj.audioUrl && (
                          <audio controls src={proj.audioUrl} className="mt-3 w-full h-8" />
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 4. BLOG PAGE */}
              {activePage === 'blog' && (
                <div className="space-y-6">
                  <div className="border-b border-[#2A3447] pb-3 mb-4">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <i className="fa-solid fa-pen-nib text-cobalt"></i>
                      {lang === 'tr' ? 'Yazılar & Saha Notları' : 'Essays & Field Notes'}
                    </h2>
                  </div>

                  <div className="space-y-4">
                    {t.blogPosts.map((post) => {
                      const isExpanded = expandedPost === post.id;
                      return (
                        <article key={post.id} className="p-5 rounded-xl bg-[#1A202C]/50 border border-[#2A3447] hover:border-cobalt/50 transition">
                          <div className="flex flex-wrap items-center justify-between gap-2 mb-2 text-xs font-mono">
                            <span className="px-2.5 py-0.5 rounded bg-cobalt/20 text-cobalt border border-cobalt/40 font-bold">
                              {post.category}
                            </span>
                            <span className="text-gray-400">{post.date} • {post.readTime}</span>
                          </div>

                          <h3 className="text-base font-bold text-white mb-2">{post.title}</h3>
                          <p className="text-xs text-gray-300 leading-relaxed mb-3">
                            {isExpanded ? post.content : post.excerpt}
                          </p>

                          {post.imageUrl && (
                            <img src={post.imageUrl} alt={post.title} className="my-3 rounded-lg w-full max-h-64 object-cover border border-[#2A3447]" />
                          )}
                          {post.audioUrl && (
                            <audio controls src={post.audioUrl} className="my-3 w-full h-8" />
                          )}

                          <button
                            onClick={() => {
                              setExpandedPost(isExpanded ? null : post.id);
                              playTone(580, 0.04);
                            }}
                            className="text-xs font-mono text-cobalt hover:underline font-semibold"
                          >
                            {isExpanded
                              ? (lang === 'tr' ? '↑ Yazıyı Daralt' : '↑ Collapse Post')
                              : (lang === 'tr' ? '↓ Devamını Oku' : '↓ Read Full Note')}
                          </button>
                        </article>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 5. TEACHING PAGE */}
              {activePage === 'teaching' && (
                <div className="space-y-6">
                  <div className="border-b border-[#2A3447] pb-3 mb-4">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <i className="fa-solid fa-chalkboard-user text-violet"></i>
                      {lang === 'tr' ? 'Öğretim & Dersler' : 'Teaching & Courses'}
                    </h2>
                  </div>

                  <div className="p-4 rounded-xl bg-violet/10 border border-violet/30 text-xs text-purple-200 leading-relaxed mb-6">
                    <i className="fa-solid fa-quote-left mr-2 text-violet"></i>
                    {t.teachingPhilosophy}
                  </div>

                  <div className="space-y-4">
                    {t.teachingCourses.map((course, idx) => (
                      <div key={idx} className="p-5 rounded-xl bg-[#1A202C]/50 border border-[#2A3447]">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                          <span className="px-2 py-0.5 rounded bg-violet/20 text-violet font-mono text-xs font-bold border border-violet/40">
                            {course.code}
                          </span>
                          <span className="text-xs font-mono text-gray-400">{course.institution}</span>
                        </div>
                        <h3 className="text-base font-bold text-white mb-1">{course.name}</h3>
                        <p className="text-xs text-violet font-mono mb-2">{course.role}</p>
                        <p className="text-xs text-gray-300 leading-relaxed">
                          {course.desc}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 6. TOOLS PAGE */}
              {activePage === 'tools' && (
                <div className="space-y-6">
                  <div className="border-b border-[#2A3447] pb-3 mb-4 flex flex-wrap items-center justify-between gap-2">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <i className="fa-solid fa-code text-[#84CC16]"></i>
                      {lang === 'tr' ? 'Araçlar, Uygulamalar & Kod Notları' : 'Tools, Apps & Code Walkthroughs'}
                    </h2>
                    <a
                      href="https://github.com/hasangoulichli"
                      target="_blank"
                      rel="noreferrer"
                      className="px-3 py-1 rounded bg-[#84CC16]/15 hover:bg-[#84CC16]/25 text-[#84CC16] border border-[#84CC16]/40 text-xs font-mono transition flex items-center gap-1.5"
                    >
                      <i className="fa-brands fa-github"></i> @hasangoulichli
                    </a>
                  </div>

                  <div className="space-y-4">
                    {t.toolsList.map((tool) => (
                      <div key={tool.id} className="p-5 rounded-xl bg-[#1A202C]/50 border border-[#2A3447] hover:border-[#84CC16]/50 transition">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                          <span className="px-2.5 py-0.5 rounded bg-[#84CC16]/20 text-[#84CC16] font-mono text-xs font-bold border border-[#84CC16]/40">
                            {tool.category}
                          </span>
                          <span className="text-xs font-mono text-gray-400">{tool.status}</span>
                        </div>

                        <h3 className="text-base font-bold text-white mb-1.5">{tool.title}</h3>
                        <p className="text-xs text-gray-300 leading-relaxed mb-3">
                          {tool.description}
                        </p>

                        <div className="flex flex-wrap gap-1.5 mb-4">
                          {tool.techStack.map((tech, i) => (
                            <span key={i} className="px-2 py-0.5 rounded bg-[#090B10] border border-[#2A3447] text-[11px] font-mono text-gray-300">
                              {tech}
                            </span>
                          ))}
                        </div>

                        <div className="pt-3 border-t border-[#2A3447]/60 flex flex-wrap items-center justify-between gap-2 text-xs font-mono">
                          <span className="text-gray-400">{tool.docsNote}</span>
                          <a
                            href={tool.githubUrl}
                            target="_blank"
                            rel="noreferrer"
                            className="text-[#84CC16] hover:underline flex items-center gap-1.5 font-semibold"
                          >
                            <i className="fa-brands fa-github"></i>
                            {lang === 'tr' ? 'GitHub Deposu' : 'GitHub Repo'}
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 7. CV PAGE */}
              {activePage === 'cv' && (
                <div className="space-y-6">
                  <div className="border-b border-[#2A3447] pb-3 mb-4 flex flex-wrap items-center justify-between gap-2">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <i className="fa-solid fa-file-lines text-cyan"></i>
                      {lang === 'tr' ? 'Akademik Özgeçmiş' : 'Curriculum Vitae'}
                    </h2>
                    <a
                      href="./assets/cv.pdf"
                      target="_blank"
                      rel="noreferrer"
                      className="px-3.5 py-1.5 rounded-lg bg-cyan/20 hover:bg-cyan/30 text-cyan border border-cyan/50 text-xs font-mono font-bold transition flex items-center gap-2"
                    >
                      <i className="fa-solid fa-download"></i>
                      {lang === 'tr' ? 'PDF İndir' : 'Download PDF'}
                    </a>
                  </div>

                  {/* Education */}
                  <div className="space-y-3">
                    <h3 className="text-xs font-mono uppercase tracking-wider text-cyan">
                      {lang === 'tr' ? 'Eğitim' : 'Education'}
                    </h3>
                    {t.cvEducation.map((edu, idx) => (
                      <div key={idx} className="p-4 rounded-xl bg-[#1A202C]/50 border border-[#2A3447]">
                        <div className="flex flex-wrap justify-between gap-1 text-xs font-mono text-gray-400 mb-1">
                          <span>{edu.school}</span>
                          <span className="text-cyan">{edu.period}</span>
                        </div>
                        <p className="text-sm font-bold text-white mb-1">{edu.degree}</p>
                        <p className="text-xs text-gray-300 leading-relaxed">{edu.detail}</p>
                      </div>
                    ))}
                  </div>

                  {/* Technical & Methodological Skills */}
                  <div className="space-y-3 pt-2">
                    <h3 className="text-xs font-mono uppercase tracking-wider text-cyan">
                      {lang === 'tr' ? 'Araştırma & Teknik Yetkinlikler' : 'Research & Technical Skills'}
                    </h3>
                    <div className="grid grid-cols-1 gap-3">
                      {t.cvSkills.map((skill, idx) => (
                        <div key={idx} className="p-3.5 rounded-xl bg-[#090B10]/70 border border-[#2A3447]">
                          <p className="text-xs font-mono text-cyan font-bold mb-1">{skill.group}</p>
                          <p className="text-xs text-gray-300">{skill.items}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* 8. CONTACT PAGE */}
              {activePage === 'contact' && (
                <div className="space-y-6">
                  <div className="border-b border-[#2A3447] pb-3 mb-4">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <i className="fa-solid fa-paper-plane text-[#F97316]"></i>
                      {lang === 'tr' ? 'İletişim & Bağlantılar' : 'Contact & Connections'}
                    </h2>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <a href="mailto:hasan.goulichli@emu.edu.tr" className="p-4 rounded-xl bg-[#1A202C]/50 border border-[#2A3447] hover:border-[#F97316]/50 transition">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-lg bg-[#F97316]/20 flex items-center justify-center text-[#F97316]">
                          <i className="fa-solid fa-university"></i>
                        </div>
                        <div>
                          <p className="text-xs font-mono text-gray-400">{lang === 'tr' ? 'Kurumsal E-Posta' : 'Academic Email'}</p>
                          <p className="text-sm font-bold text-white">hasan.goulichli@emu.edu.tr</p>
                        </div>
                      </div>
                    </a>

                    <a href="mailto:hasangoulichli@gmail.com" className="p-4 rounded-xl bg-[#1A202C]/50 border border-[#2A3447] hover:border-[#F97316]/50 transition">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-lg bg-[#F97316]/20 flex items-center justify-center text-[#F97316]">
                          <i className="fa-solid fa-envelope"></i>
                        </div>
                        <div>
                          <p className="text-xs font-mono text-gray-400">{lang === 'tr' ? 'Kişisel E-Posta' : 'Personal Email'}</p>
                          <p className="text-sm font-bold text-white">hasangoulichli@gmail.com</p>
                        </div>
                      </div>
                    </a>
                  </div>

                  <div className="p-4 rounded-xl bg-[#1A202C]/30 border border-[#2A3447] text-xs text-gray-400 flex items-center gap-2">
                    <i className="fa-solid fa-location-dot text-[#F97316]"></i>
                    <span>
                      {lang === 'tr'
                        ? 'Konum: Doğu Akdeniz Üniversitesi, Psikoloji Bölümü, Gazimağusa / Girne, KKTC'
                        : 'Location: Department of Psychology, Eastern Mediterranean University, Famagusta / Kyrenia, North Cyprus'}
                    </span>
                  </div>
                </div>
              )}

              {/* PADD Bottom Rail (Active when Focus Mode is OFF) */}
              {!focusMode && (
                <div className="flex items-center gap-3 mt-10">
                  <div
                    style={{ backgroundColor: `${currentNav.color}40` }}
                    className="h-3 flex-1 rounded-l-full"
                  />
                  <div
                    style={{ backgroundColor: currentNav.color }}
                    className="h-3 w-14 rounded-r-full"
                  />
                </div>
              )}
            </div>
          </main>

          {/* Footer */}
          <footer className="border-t border-[#1E2534] py-4 text-center text-xs font-mono text-gray-500">
            © {new Date().getFullYear()} {lang === 'tr' ? 'Hasan Güliçli' : 'Hasan Goulichli'} • {lang === 'tr' ? 'Uygulamalı Bilişsel Psikoloji' : 'Applied Cognitive Psychology'}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
