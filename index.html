      if (!enabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.03, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);

        // Ignore audio errors before user interaction

    };

              {activeTab === 'teaching' && (
                <div>
                  <span className="inline-block font-mono text-xs font-bold px-2.5 py-1 rounded-md bg-lcars-blue/15 text-lcars-blue mb-3">
                    {t.teaching.badge}
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white leading-tight mb-5">
                    {t.teaching.title}
                  </h2>

                  <div className="space-y-3 mb-6">
                    {t.teaching.courses.map((course, idx) => (
                      <div key={idx} className="bg-black/35 border border-lcars-border rounded-xl p-4 sm:p-5">
                        <h3 className="font-mono text-xs sm:text-sm font-bold text-lcars-blue mb-1.5">
                          {course.code}
                        </h3>
                        <p className="text-sm text-lcars-textMain/85 leading-relaxed max-w-[65ch]">
                          {course.desc}
                        </p>
                      </div>
                    ))}
                  </div>

                  <a
                    href="./assets/cv.pdf"
                    download="Hasan-Goulichli-CV.pdf"
                    onClick={() => {
                      playUiTone(660, 0.07, soundEnabled);
                      showToast(t.teaching.cvToast);
                    }}
                    className="inline-block text-center w-full sm:w-auto px-5 py-3 rounded-xl bg-lcars-blue text-white font-mono text-xs font-bold tracking-wider hover:brightness-110 transition mb-6"
                  >
                    {t.teaching.cvButton}
                  </a>

                  <div className="border-t border-lcars-border pt-5">
                    <h4 className="font-mono text-xs font-bold text-lcars-textMuted uppercase mb-3">
                      {t.teaching.linksTitle}
                    </h4>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                      {[
                        { name: 'ORCID', url: 'https://orcid.org/0009-0008-7005-6401' },
                        { name: 'OSF', url: 'https://osf.io/xm3gk/' },
                        { name: 'Google Scholar', url: 'https://scholar.google.com/citations?user=BttAEJcAAAAJ&hl=en' },
                        { name: 'ResearchGate', url: 'https://www.researchgate.net/profile/Hasan-Goulichli?ev=hdr_xprf' },
                        { name: 'LinkedIn', url: 'https://www.linkedin.com/in/hasangoulichli/' },
                        { name: 'GitHub', url: 'https://github.com/hasangoulichli' },
                        { name: 'EMU Email', url: 'mailto:hasan.goulichli@emu.edu.tr' },
                        { name: 'Personal Email', url: 'mailto:hasangoulichli@gmail.com' }
                      ].map((link) => (
                        <a
                          key={link.name}
                          href={link.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          onClick={() => playUiTone(580, 0.04, soundEnabled)}
                          className="px-3.5 py-2.5 rounded-lg bg-black/40 border border-lcars-border hover:border-lcars-blue text-xs font-mono font-semibold text-white flex items-center justify-between transition"
                        >
                          <span>{link.name}</span>
                          <span className="text-lcars-blue">↗</span>
                        </a>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </section>

            {/* RIGHT BAY: RESEARCH TELEMETRY & MEDIA STATUS */}
            <aside
              className={`lg:col-span-3 space-y-3 transition-opacity duration-300 ${
                focusMode ? 'ergonomic-dim' : ''
              }`}
            >
              <div className="bg-lcars-card border border-lcars-border rounded-2xl p-4">
                <div className="flex items-center justify-between mb-3">
                  <span className="font-mono text-xs font-bold text-white tracking-wider">
                    {t.telemetry.title}
                  </span>
                  <span
                    className="w-2.5 h-2.5 rounded-full animate-pulse"
                    style={{ backgroundColor: activeColor }}
                  ></span>
                </div>

                <div className="bg-black/40 border border-lcars-border rounded-xl p-3 mb-3">
                  <div className="font-mono text-[10px] text-lcars-textMuted uppercase">
                    {t.telemetry.targetLabel}
                  </div>
                  <div className="text-xs font-semibold text-white mt-1 leading-snug">
                    {t.telemetry.targetValue}
                  </div>
                </div>

                <div className="mb-3">
                  <div className="font-mono text-[10px] text-lcars-textMuted uppercase mb-2">
                    {t.telemetry.stackLabel}
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {t.telemetry.stackItems.map((item) => (
                      <span
                        key={item}
                        className="font-mono text-[11px] px-2.5 py-1 rounded-md bg-black/40 border border-lcars-border text-lcars-textMain"
                      >
                        {item}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="bg-black/30 border border-dashed border-lcars-border rounded-xl p-3">
                  <div className="font-mono text-[10px] font-bold text-lcars-teal uppercase mb-1">
                    {t.telemetry.mediaTitle}
                  </div>
                  <p className="text-[11px] text-lcars-textMuted leading-relaxed">
                    {t.telemetry.mediaHint}
                  </p>
                </div>
              </div>
            </aside>
          </main>

          {/* BOTTOM STRUCTURAL ELBOW BAR */}
          <footer className="mt-4">
            <div className="flex items-stretch">
              <div
                className="w-24 sm:w-32 lcars-elbow-bottom-left transition-colors duration-300 flex items-center justify-center px-3 py-2.5"
                style={{ backgroundColor: activeColor }}
              >
                <span className="font-mono text-[11px] font-bold text-black">
                  ACTIVE
                </span>
              </div>
              <div className="flex-1 bg-lcars-card border-y border-r border-lcars-border rounded-r-2xl px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2 ml-1.5 font-mono text-[11px] text-lcars-textMuted">
                <span>HASAN GÜLİÇLİ • APPLIED COGNITIVE PSYCHOLOGY</span>
                <span>BILINGUAL INTERFACE (TR / ENG) • MEDIA-READY</span>
              </div>
            </div>
          </footer>

          {/* NON-BLOCKING NOTIFICATION TOAST */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 max-w-sm bg-lcars-card border-l-4 border-lcars-blue text-white px-4 py-3 rounded-xl shadow-2xl font-mono text-xs">
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
