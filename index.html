    // Subtle Web Audio synthesizer for tactile UI feedback
    function playTone(freq = 540, duration = 0.065) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.035, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (_) {}
    }

        setActiveTab(id);
        if (soundEnabled) playTone(440 + idx * 35, 0.06);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, [soundEnabled]);

      const toggleLang = () => {
        setLang((prev) => (prev === "en" ? "tr" : "en"));
        if (soundEnabled) playTone(680, 0.07);
      };

      const toggleFocus = () => {
        setFocusMode((prev) => !prev);
        if (soundEnabled) playTone(380, 0.07);
      };

      const toggleSound = () => {

          if (next) playTone(620, 0.07);
          return next;
        });
      };

                        {data.home.personalNoteTitle}
                      </h3>
                      <p className="text-sm text-gray-300 leading-relaxed">{data.home.personalNote}</p>
                    </section>
                  </div>
                )}

                {/* ================= PUBLICATIONS ================= */}
                {activeTab === "publications" && (

                        <div className="space-y-4">

                            <article
                              key={pIdx}
                              className="p-4 sm:p-5 rounded-xl bg-[#131824] border border-gray-800/90 space-y-2.5"

                            >
                              <span
                                className="inline-block px-2.5 py-0.5 rounded-full font-mono text-[11px] font-bold"

                              <p className="text-sm sm:text-base text-white leading-relaxed">{pub.citation}</p>

                                        border: `1px solid ${accent}88`,
                                        backgroundColor: `${accent}14`

                                      {lnk.label} ↗
                                    </a>
                                  ))}
                                </div>
                              )}
                            </article>
                          ))}
                        </div>
                      </section>
                    ))}
                  </div>
                )}

                {/* ================= PROJECTS ================= */}
                {activeTab === "projects" && (
                  <div className="space-y-7">
                    <div className="space-y-2">
                      <h1 className="text-2xl sm:text-3xl font-bold font-mono" style={{ color: accent }}>
                        {data.projects.title}
                      </h1>
                      <p className="text-sm sm:text-base text-gray-400">{data.projects.subtitle}</p>
                    </div>

                    <div className="space-y-5">
                      {data.projects.items.map((proj, idx) => (

                            </span>
                            <span className="font-mono text-xs text-gray-400">{proj.period}</span>
                          </div>
                          <h2 className="text-lg font-bold text-white">{proj.title}</h2>
                          <p className="font-mono text-xs text-gray-400">{proj.meta}</p>

                            <audio controls className="w-full mt-2"><source src={proj.audioUrl} /></audio>

                              <span key={tIdx} className="px-2.5 py-0.5 rounded-md bg-[#0E121B] border border-gray-800 font-mono text-[11px] text-gray-300">

                              </span>
                            ))}
                          </div>

                          {proj.links && proj.links.length > 0 && (
                            <div className="flex flex-wrap gap-2 pt-2">
                              {proj.links.map((lnk, lIdx) => (
                                <a
                                  key={lIdx}
                                  href={lnk.url}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="px-3 py-1 rounded-lg font-mono text-xs font-semibold"
                                  style={{ color: accent, border: `1px solid ${accent}88`, backgroundColor: `${accent}14` }}

                                  {lnk.label} ↗
                                </a>
                              ))}
                            </div>
                          )}
                        </article>
                      ))}
                    </div>
                  </div>
                )}

                {/* ================= BLOG ================= */}

                      </h1>
                      <p className="text-sm sm:text-base text-gray-400">{data.blog.subtitle}</p>
                    </div>

                    <div className="space-y-4">
                      {data.blog.posts.map((post, idx) => (
                        <article
                          key={idx}
                          className="p-5 rounded-xl bg-[#131824] border border-gray-800/90 space-y-2.5"
                          style={{ borderLeft: `4px solid ${accent}` }}
                        >
                          <div className="flex flex-wrap items-center gap-2 font-mono text-xs">
                            <span className="px-2 py-0.5 rounded" style={{ backgroundColor: `${accent}20`, color: accent }}>
                              {post.category}
                            </span>
                            <span className="text-gray-400">{post.date}</span>
                            <span className="text-gray-500">· {post.readTime}</span>

                          <h2 className="text-lg font-bold text-white">{post.title}</h2>
                          <p className="text-sm sm:text-base text-gray-300 leading-relaxed">{post.excerpt}</p>

                            <img src={post.imageUrl} alt={post.title} className="rounded-lg w-full max-h-72 object-cover border border-gray-800" />

                            <audio controls className="w-full mt-2"><source src={post.audioUrl} /></audio>
                          )}

                      ))}
                    </div>
                  </div>

                    </div>

                    <section className="p-5 rounded-xl bg-[#131824] border border-gray-800/90 space-y-2" style={{ borderLeft: `4px solid ${accent}` }}>

                        {data.teaching.philosophyTitle}

                            <span className="px-2.5 py-0.5 rounded-full font-mono text-[11px] font-bold" style={{ backgroundColor: `${accent}20`, color: accent }}>

                          <div className="flex flex-wrap gap-1.5">

                              <span key={tIdx} className="px-2.5 py-0.5 rounded-md bg-[#0E121B] border border-gray-800 font-mono text-[11px] text-gray-300">

                          <div className="pt-1">
                            <a
                              href={tool.repoUrl}

                        <div className="space-y-3.5">
                          {group.items.map((item, iIdx) => (
                            <article
                              key={iIdx}
                              className="p-4 sm:p-5 rounded-xl bg-[#131824] border border-gray-800/90 space-y-1.5"

                              <div className="flex flex-wrap items-center justify-between gap-2">
                                <h3 className="text-base font-bold text-white">{item.role}</h3>
                                <span className="font-mono text-xs text-gray-400">{item.period}</span>
                              </div>
                              <p className="font-mono text-xs" style={{ color: accent }}>{item.org}</p>
                              <p className="text-sm text-gray-300 leading-relaxed pt-1">{item.details}</p>

                            <div className="flex flex-wrap items-center justify-between gap-2">
                              <h3 className="font-bold text-white text-sm sm:text-base">{edu.degree}</h3>
                              <span className="font-mono text-xs text-gray-400">{edu.period}</span>
                            </div>
                            <p className="font-mono text-xs" style={{ color: accent }}>{edu.institution}</p>

                    </section>

                    {/* Awards & Scholarships */}
                    <section className="space-y-3">
                      <h2 className="text-sm font-mono font-bold uppercase tracking-wider text-gray-300 border-b border-gray-800 pb-2">
                        {data.cv.awardsTitle}
                      </h2>
                      <ul className="space-y-2 text-sm text-gray-300">
                        {data.cv.awards.map((aw, i) => (
                          <li key={i} className="p-3 rounded-lg bg-[#131824] border border-gray-800/80">
                            {aw}
                          </li>
                        ))}
                      </ul>
                    </section>

                    {/* Skills */}
                    <section className="space-y-3">
                      <h2 className="text-sm font-mono font-bold uppercase tracking-wider text-gray-300 border-b border-gray-800 pb-2">
                        {data.cv.skillsTitle}
                      </h2>
                      <div className="space-y-2.5">
                        {data.cv.skills.map((sk, i) => (
                          <div key={i} className="p-4 rounded-xl bg-[#131824] border border-gray-800/80">
                            <div className="font-mono text-xs font-bold uppercase mb-1" style={{ color: accent }}>
                              {sk.category}
                            </div>
                            <p className="text-sm text-gray-300 leading-relaxed">{sk.items}</p>
                          </div>
                        ))}
                      </div>
                    </section>
                  </div>

                {/* ================= CONTACT ================= */}

                  <div className="space-y-6">

                      <h1 className="text-2xl sm:text-3xl font-bold font-mono" style={{ color: accent }}>
                        {data.contact.title}
                      </h1>
                      <p className="text-sm sm:text-base text-gray-400">{data.contact.subtitle}</p>
                    </div>

                    <p className="text-sm sm:text-base text-gray-300 leading-relaxed">{data.contact.note}</p>

                    <div className="space-y-3">
                      {data.contact.emails.map((em, i) => (
                        <div
                          key={i}
                          className="p-4 rounded-xl bg-[#131824] border border-gray-800/90 flex flex-wrap items-center justify-between gap-2"
                          style={{ borderLeft: `4px solid ${accent}` }}
                        >
                          <span className="font-mono text-xs text-gray-400 uppercase">{em.label}</span>
                          <a href={`mailto:${em.value}`} className="font-mono text-sm font-bold hover:underline" style={{ color: accent }}>
                            {em.value}
                          </a>
                        </div>
                      ))}

                      <div
                        className="p-4 rounded-xl bg-[#131824] border border-gray-800/90 flex flex-wrap items-center justify-between gap-2"
                        style={{ borderLeft: `4px solid ${accent}` }}
                      >
                        <span className="font-mono text-xs text-gray-400 uppercase">{data.contact.locationLabel}</span>
                        <span className="font-mono text-sm text-white">{data.contact.locationValue}</span>
                      </div>
                    </div>

                    <div className="pt-2 flex flex-wrap gap-2">
                      {SOCIAL_LINKS.map((item) => (
                        <a
                          key={item.name}
                          href={item.url}
                          target={item.url.startsWith("mailto:") ? undefined : "_blank"}
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#141926] border border-gray-800 hover:border-gray-600 text-xs font-mono text-gray-200 transition-colors"
                        >
                          <span style={{ color: item.color }}>{item.icon}</span>
                          <span>{item.name}</span>
                        </a>
                      ))}
                    </div>
                  </div>
                )}
              </FrameWrapper>
            </main>

            <footer className="mt-8 text-center font-mono text-xs text-gray-500">
              © {new Date().getFullYear()} {data.brandName} · {data.location}
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
