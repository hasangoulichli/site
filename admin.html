<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Studio & Content Editor | Hasan Goulichli</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="./data/config.js"></script>
  <script src="./data/research_outputs.js"></script>
  <script src="./data/profile_teaching.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
    body { background-color: #090B10; color: #E5E7EB; font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen bg-[#090B10] text-gray-200 pb-20">
  <div id="admin-root"></div>

  <script type="text/babel">
    const { useState } = React;

    function clone(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function downloadTextFile(filename, content) {
      const blob = new Blob([content], { type: "application/javascript;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function AdminApp() {
      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem("HG_SITE_CONFIG_DRAFT");
          return saved ? JSON.parse(saved) : clone(window.SITE_CONFIG);
        } catch (_) { return clone(window.SITE_CONFIG); }
      });

      const [research, setResearch] = useState(() => {
        try {
          const saved = localStorage.getItem("HG_SITE_RESEARCH_DRAFT");
          return saved ? JSON.parse(saved) : clone(window.SITE_RESEARCH);
        } catch (_) { return clone(window.SITE_RESEARCH); }
      });

      const [profile, setProfile] = useState(() => {
        try {
          const saved = localStorage.getItem("HG_SITE_PROFILE_DRAFT");
          return saved ? JSON.parse(saved) : clone(window.SITE_PROFILE);
        } catch (_) { return clone(window.SITE_PROFILE); }
      });

      const [section, setSection] = useState("theme");
      const [toast, setToast] = useState("");
      const [editingIndex, setEditingIndex] = useState(null);

      // Generic bilingual form state for Add / Edit
      const [formState, setFormState] = useState({});

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3500);
      };

      const saveDraftsToBrowser = (nextCfg = config, nextRes = research, nextProf = profile) => {
        localStorage.setItem("HG_SITE_CONFIG_DRAFT", JSON.stringify(nextCfg));
        localStorage.setItem("HG_SITE_RESEARCH_DRAFT", JSON.stringify(nextRes));
        localStorage.setItem("HG_SITE_PROFILE_DRAFT", JSON.stringify(nextProf));
        notify("Draft saved to browser! Open index.html to preview live.");
      };

      const resetDrafts = () => {
        localStorage.removeItem("HG_SITE_CONFIG_DRAFT");
        localStorage.removeItem("HG_SITE_RESEARCH_DRAFT");
        localStorage.removeItem("HG_SITE_PROFILE_DRAFT");
        setConfig(clone(window.SITE_CONFIG));
        setResearch(clone(window.SITE_RESEARCH));
        setProfile(clone(window.SITE_PROFILE));
        setEditingIndex(null);
        setFormState({});
        notify("Reset to published repository files.");
      };

      const exportFile = (which) => {
        if (which === "config") {
          const text = "// Auto-generated by admin.html\nwindow.SITE_CONFIG = " + JSON.stringify(config, null, 2) + ";\n";
          downloadTextFile("config.js", text);
          notify("Downloaded data/config.js");
        } else if (which === "research") {
          const text = "// Auto-generated by admin.html\nwindow.SITE_RESEARCH = " + JSON.stringify(research, null, 2) + ";\n";
          downloadTextFile("research_outputs.js", text);
          notify("Downloaded data/research_outputs.js");
        } else if (which === "profile") {
          const text = "// Auto-generated by admin.html\nwindow.SITE_PROFILE = " + JSON.stringify(profile, null, 2) + ";\n";
          downloadTextFile("profile_teaching.js", text);
          notify("Downloaded data/profile_teaching.js");
        }
      };

      // ================= THEME & BUTTON DESIGN HANDLERS =================
      const updateThemeField = (key, val) => {
        const next = { ...config, theme: { ...config.theme, [key]: val } };
        setConfig(next);
        saveDraftsToBrowser(next, research, profile);
      };

      const updateTabColor = (idx, color) => {
        const nextTabs = [...config.tabs];
        nextTabs[idx] = { ...nextTabs[idx], color };
        const next = { ...config, tabs: nextTabs };
        setConfig(next);
        saveDraftsToBrowser(next, research, profile);
      };

      // ================= BLOG CRUD =================
      const startEditBlog = (idx) => {
        const enPost = research.en.blog.posts[idx];
        const trPost = research.tr.blog.posts[idx] || enPost;
        setEditingIndex(idx);
        setFormState({
          date: enPost.date || "2026",
          enCategory: enPost.category || "",
          trCategory: trPost.category || "",
          enTitle: enPost.title || "",
          trTitle: trPost.title || "",
          enExcerpt: enPost.excerpt || "",
          trExcerpt: trPost.excerpt || "",
          enReadTime: enPost.readTime || "3 min note",
          trReadTime: trPost.readTime || "3 dk okuma",
          imageUrl: enPost.imageUrl || "",
          audioUrl: enPost.audioUrl || ""
        });
      };

      const saveBlogPost = (e) => {
        e.preventDefault();
        const next = clone(research);
        const enItem = {
          date: formState.date || "2026",
          category: formState.enCategory || "Field Note",
          title: formState.enTitle || "Untitled Note",
          excerpt: formState.enExcerpt || "",
          readTime: formState.enReadTime || "3 min note",
          imageUrl: formState.imageUrl || "",
          audioUrl: formState.audioUrl || ""
        };
        const trItem = {
          date: formState.date || "2026",
          category: formState.trCategory || enItem.category,
          title: formState.trTitle || enItem.title,
          excerpt: formState.trExcerpt || enItem.excerpt,
          readTime: formState.trReadTime || "3 dk okuma",
          imageUrl: formState.imageUrl || "",
          audioUrl: formState.audioUrl || ""
        };
        if (editingIndex !== null) {
          next.en.blog.posts[editingIndex] = enItem;
          next.tr.blog.posts[editingIndex] = trItem;
        } else {
          next.en.blog.posts.unshift(enItem);
          next.tr.blog.posts.unshift(trItem);
        }
        setResearch(next);
        saveDraftsToBrowser(config, next, profile);
        setEditingIndex(null);
        setFormState({});
      };

      const deleteBlogPost = (idx) => {
        const next = clone(research);
        next.en.blog.posts.splice(idx, 1);
        next.tr.blog.posts.splice(idx, 1);
        setResearch(next);
        saveDraftsToBrowser(config, next, profile);
      };

      // ================= PROJECTS CRUD =================
      const startEditProject = (idx) => {
        const enP = research.en.projects.items[idx];
        const trP = research.tr.projects.items[idx] || enP;
        setEditingIndex(idx);
        setFormState({
          enTitle: enP.title || "",
          trTitle: trP.title || "",
          enStatus: enP.status || "Ongoing",
          trStatus: trP.status || "Devam Ediyor",
          enPeriod: enP.period || "",
          trPeriod: trP.period || "",
          enMeta: enP.meta || "",
          trMeta: trP.meta || "",
          enSummary: enP.summary || "",
          trSummary: trP.summary || "",
          tagsStr: (enP.tags || []).join(", "),
          linkLabel: enP.links?.[0]?.label || "",
          linkUrl: enP.links?.[0]?.url || "",
          imageUrl: enP.imageUrl || "",
          audioUrl: enP.audioUrl || ""
        });
      };

      const saveProject = (e) => {
        e.preventDefault();
        const next = clone(research);
        const tags = (formState.tagsStr || "").split(",").map(s => s.trim()).filter(Boolean);
        const links = formState.linkUrl ? [{ label: formState.linkLabel || "Link", url: formState.linkUrl }] : [];
        const enItem = {
          title: formState.enTitle || "New Study",
          status: formState.enStatus || "Ongoing",
          period: formState.enPeriod || "",
          meta: formState.enMeta || "",
          summary: formState.enSummary || "",
          tags,
          links,
          imageUrl: formState.imageUrl || "",
          audioUrl: formState.audioUrl || ""
        };
        const trItem = {
          title: formState.trTitle || enItem.title,
          status: formState.trStatus || "Devam Ediyor",
          period: formState.trPeriod || enItem.period,
          meta: formState.trMeta || enItem.meta,
          summary: formState.trSummary || enItem.summary,
          tags,
          links,
          imageUrl: formState.imageUrl || "",
          audioUrl: formState.audioUrl || ""
        };
        if (editingIndex !== null) {
          next.en.projects.items[editingIndex] = enItem;
          next.tr.projects.items[editingIndex] = trItem;
        } else {
          next.en.projects.items.unshift(enItem);
          next.tr.projects.items.unshift(trItem);
        }
        setResearch(next);
        saveDraftsToBrowser(config, next, profile);
        setEditingIndex(null);
        setFormState({});
      };

      const deleteProject = (idx) => {
        const next = clone(research);
        next.en.projects.items.splice(idx, 1);
        next.tr.projects.items.splice(idx, 1);
        setResearch(next);
        saveDraftsToBrowser(config, next, profile);
      };

      // ================= PUBLICATIONS CRUD =================
      const startEditPub = (secIdx, pubIdx) => {
        const enPub = research.en.publications.sections[secIdx].items[pubIdx];
        const trPub = research.tr.publications.sections[secIdx]?.items[pubIdx] || enPub;
        setEditingIndex(`${secIdx}:${pubIdx}`);
        setFormState({
          secIdx,
          enStatus: enPub.status || "",
          trStatus: trPub.status || "",
          citation: enPub.citation || "",
          enRole: enPub.role || "",
          trRole: trPub.role || "",
          linkLabel: enPub.links?.[0]?.label || "",
          linkUrl: enPub.links?.[0]?.url || ""
        });
      };

      const savePub = (e) => {
        e.preventDefault();
        const next = clone(research);
        const sIdx = Number(formState.secIdx || 0);
        const links = formState.linkUrl ? [{ label: formState.linkLabel || "DOI / Link", url: formState.linkUrl }] : [];
        const enItem = {
          status: formState.enStatus || "Published",
          citation: formState.citation || "",
          role: formState.enRole || "",
          links
        };
        const trItem = {
          status: formState.trStatus || enItem.status,
          citation: formState.citation || "",
          role: formState.trRole || enItem.role,
          links
        };
        if (typeof editingIndex === "string" && editingIndex.includes(":")) {
          const [oldSec, oldIdx] = editingIndex.split(":").map(Number);
          next.en.publications.sections[oldSec].items[oldIdx] = enItem;
          next.tr.publications.sections[oldSec].items[oldIdx] = trItem;
        } else {
          next.en.publications.sections[sIdx].items.unshift(enItem);
          next.tr.publications.sections[sIdx].items.unshift(trItem);
        }
        setResearch(next);
        saveDraftsToBrowser(config, next, profile);
        setEditingIndex(null);
        setFormState({});
      };

      const deletePub = (secIdx, pubIdx) => {
        const next = clone(research);
        next.en.publications.sections[secIdx].items.splice(pubIdx, 1);
        next.tr.publications.sections[secIdx].items.splice(pubIdx, 1);
        setResearch(next);
        saveDraftsToBrowser(config, next, profile);
      };

      // ================= TOOLS CRUD =================
      const startEditTool = (idx) => {
        const enT = research.en.tools.items[idx];
        const trT = research.tr.tools.items[idx] || enT;
        setEditingIndex(idx);
        setFormState({
          enName: enT.name || "",
          trName: trT.name || "",
          enStatus: enT.status || "",
          trStatus: trT.status || "",
          stackStr: (enT.stack || []).join(", "),
          enDesc: enT.description || "",
          trDesc: trT.description || "",
          repoUrl: enT.repoUrl || "https://github.com/hasangoulichli",
          enRepoLabel: enT.repoLabel || "View on GitHub",
          trRepoLabel: trT.repoLabel || "GitHub'da İncele"
        });
      };

      const saveTool = (e) => {
        e.preventDefault();
        const next = clone(research);
        const stack = (formState.stackStr || "").split(",").map(s => s.trim()).filter(Boolean);
        const enItem = {
          name: formState.enName || "New Tool",
          status: formState.enStatus || "Active",
          stack,
          description: formState.enDesc || "",
          repoUrl: formState.repoUrl || "https://github.com/hasangoulichli",
          repoLabel: formState.enRepoLabel || "View on GitHub"
        };
        const trItem = {
          name: formState.trName || enItem.name,
          status: formState.trStatus || enItem.status,
          stack,
          description: formState.trDesc || enItem.description,
          repoUrl: enItem.repoUrl,
          repoLabel: formState.trRepoLabel || "GitHub'da İncele"
        };
        if (editingIndex !== null) {
          next.en.tools.items[editingIndex] = enItem;
          next.tr.tools.items[editingIndex] = trItem;
        } else {
          next.en.tools.items.unshift(enItem);
          next.tr.tools.items.unshift(trItem);
        }
        setResearch(next);
        saveDraftsToBrowser(config, next, profile);
        setEditingIndex(null);
        setFormState({});
      };

      const deleteTool = (idx) => {
        const next = clone(research);
        next.en.tools.items.splice(idx, 1);
        next.tr.tools.items.splice(idx, 1);
        setResearch(next);
        saveDraftsToBrowser(config, next, profile);
      };

      // ================= BEYOND RESEARCH CRUD =================
      const startEditBeyond = (gIdx, iIdx) => {
        const enB = profile.en.beyond.groups[gIdx].items[iIdx];
        const trB = profile.tr.beyond.groups[gIdx]?.items[iIdx] || enB;
        setEditingIndex(`${gIdx}:${iIdx}`);
        setFormState({
          gIdx,
          enRole: enB.role || "",
          trRole: trB.role || "",
          enOrg: enB.org || "",
          trOrg: trB.org || "",
          enPeriod: enB.period || "",
          trPeriod: trB.period || "",
          enDetails: enB.details || "",
          trDetails: trB.details || ""
        });
      };

      const saveBeyond = (e) => {
        e.preventDefault();
        const next = clone(profile);
        const gIdx = Number(formState.gIdx || 0);
        const enItem = {
          role: formState.enRole || "",
          org: formState.enOrg || "",
          period: formState.enPeriod || "",
          details: formState.enDetails || ""
        };
        const trItem = {
          role: formState.trRole || enItem.role,
          org: formState.trOrg || enItem.org,
          period: formState.trPeriod || enItem.period,
          details: formState.trDetails || enItem.details
        };
        if (typeof editingIndex === "string" && editingIndex.includes(":")) {
          const [oldG, oldI] = editingIndex.split(":").map(Number);
          next.en.beyond.groups[oldG].items[oldI] = enItem;
          next.tr.beyond.groups[oldG].items[oldI] = trItem;
        } else {
          next.en.beyond.groups[gIdx].items.unshift(enItem);
          next.tr.beyond.groups[gIdx].items.unshift(trItem);
        }
        setProfile(next);
        saveDraftsToBrowser(config, research, next);
        setEditingIndex(null);
        setFormState({});
      };

      const deleteBeyond = (gIdx, iIdx) => {
        const next = clone(profile);
        next.en.beyond.groups[gIdx].items.splice(iIdx, 1);
        next.tr.beyond.groups[gIdx].items.splice(iIdx, 1);
        setProfile(next);
        saveDraftsToBrowser(config, research, next);
      };

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-6 space-y-6">
          {/* TOP ADMIN BAR */}
          <header className="p-5 rounded-2xl bg-[#111622] border border-gray-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span className="font-mono text-xs text-emerald-400 uppercase font-bold">Content & Theme Studio</span>
              <h1 className="text-xl sm:text-2xl font-bold text-white">Hasan Goulichli — Site Admin</h1>
            </div>
            <div className="flex flex-wrap gap-2">
              <a
                href="./index.html"
                target="_blank"
                className="px-3.5 py-2 rounded-lg font-mono text-xs font-bold bg-emerald-500 text-gray-950 hover:brightness-110"
              >
                Preview Live Site ↗
              </a>
              <button
                onClick={resetDrafts}
                className="px-3.5 py-2 rounded-lg font-mono text-xs font-semibold bg-[#182032] border border-gray-700 text-gray-300 hover:border-red-400 hover:text-red-300 cursor-pointer"
              >
                Reset Drafts
              </button>
            </div>
          </header>

          {toast && (
            <div className="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/50 text-emerald-300 font-mono text-xs">
              {toast}
            </div>
          )}

          {/* EXPORT BAR FOR GITHUB PAGES */}
          <section className="p-4 rounded-2xl bg-[#111622] border border-gray-800 flex flex-wrap items-center justify-between gap-3">
            <div className="text-xs text-gray-400">
              <strong className="text-gray-200 font-mono">Publish to GitHub:</strong> Changes preview immediately in your browser. Download the updated <code>.js</code> files below and upload them to <code>data/</code> in your repo.
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => exportFile("config")} className="px-3 py-1.5 rounded-lg font-mono text-xs font-bold bg-amber-500/20 border border-amber-500 text-amber-300 cursor-pointer">
                Download data/config.js ↓
              </button>
              <button onClick={() => exportFile("research")} className="px-3 py-1.5 rounded-lg font-mono text-xs font-bold bg-blue-500/20 border border-blue-500 text-blue-300 cursor-pointer">
                Download data/research_outputs.js ↓
              </button>
              <button onClick={() => exportFile("profile")} className="px-3 py-1.5 rounded-lg font-mono text-xs font-bold bg-pink-500/20 border border-pink-500 text-pink-300 cursor-pointer">
                Download data/profile_teaching.js ↓
              </button>
            </div>
          </section>

          {/* SECTION SELECTOR */}
          <nav className="flex flex-wrap gap-2">
            {[
              { id: "theme", label: "1. Design, Colors & Shapes" },
              { id: "blog", label: "2. Blog (Add / Edit)" },
              { id: "projects", label: "3. Projects (Add / Edit)" },
              { id: "publications", label: "4. Publications (Add / Edit)" },
              { id: "tools", label: "5. Tools (Add / Edit)" },
              { id: "beyond", label: "6. Beyond Research (Add / Edit)" }
            ].map((s) => (
              <button
                key={s.id}
                onClick={() => { setSection(s.id); setEditingIndex(null); setFormState({}); }}
                className={`px-3.5 py-2 rounded-lg font-mono text-xs font-bold cursor-pointer border ${
                  section === s.id
                    ? "bg-white text-gray-950 border-white"
                    : "bg-[#121620] text-gray-300 border-gray-800 hover:border-gray-600"
                }`}
              >
                {s.label}
              </button>
            ))}
          </nav>

          {/* ================= 1. THEME, COLORS & SHAPES ================= */}
          {section === "theme" && (
            <div className="p-6 rounded-2xl bg-[#111622] border border-gray-800 space-y-6">
              <h2 className="font-mono text-lg font-bold text-white">Button Shapes, Overall Page Design & Tab Colors</h2>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="space-y-1.5">
                  <label className="block font-mono text-xs text-gray-400">Button Shape (Corner Radius)</label>
                  <select
                    value={config.theme.buttonRadius}
                    onChange={(e) => updateThemeField("buttonRadius", e.target.value)}
                    className="w-full p-2.5 rounded-lg bg-[#090B10] border border-gray-700 text-sm text-white"
                  >
                    <option value="0.25rem">Crisp Tech Corners (4px)</option>
                    <option value="0.5rem">Rounded Rectangles (8px)</option>
                    <option value="9999px">LCARS Capsule Pills (Full)</option>
                  </select>
                </div>

                <div className="space-y-1.5">
                  <label className="block font-mono text-xs text-gray-400">Button Fill Style</label>
                  <select
                    value={config.theme.buttonStyle}
                    onChange={(e) => updateThemeField("buttonStyle", e.target.value)}
                    className="w-full p-2.5 rounded-lg bg-[#090B10] border border-gray-700 text-sm text-white"
                  >
                    <option value="outlined">Dark Outlined (High Contrast)</option>
                    <option value="tinted">Color-Tinted Glass</option>
                    <option value="solid">Solid Vibrant LCARS</option>
                  </select>
                </div>

                <div className="space-y-1.5">
                  <label className="block font-mono text-xs text-gray-400">Card & Frame Shape</label>
                  <select
                    value={config.theme.cardRadius}
                    onChange={(e) => {
                      const val = e.target.value;
                      const frameVal = val === "0.25rem" ? "0.5rem" : val === "0.75rem" ? "1.5rem" : "2rem";
                      const next = { ...config, theme: { ...config.theme, cardRadius: val, frameRadius: frameVal } };
                      setConfig(next);
                      saveDraftsToBrowser(next, research, profile);
                    }}
                    className="w-full p-2.5 rounded-lg bg-[#090B10] border border-gray-700 text-sm text-white"
                  >
                    <option value="0.25rem">Angular / Geometric</option>
                    <option value="0.75rem">Standard Modern</option>
                    <option value="1.25rem">Soft PADD Curves</option>
                  </select>
                </div>

                <div className="space-y-1.5">
                  <label className="block font-mono text-xs text-gray-400">Default Focus Mode on Load</label>
                  <select
                    value={String(config.theme.defaultFocusMode)}
                    onChange={(e) => updateThemeField("defaultFocusMode", e.target.value === "true")}
                    className="w-full p-2.5 rounded-lg bg-[#090B10] border border-gray-700 text-sm text-white"
                  >
                    <option value="false">OFF (PADD Tablet Frame)</option>
                    <option value="true">ON (Stepped Bays + Calm Reader)</option>
                  </select>
                </div>

                <div className="space-y-1.5">
                  <label className="block font-mono text-xs text-gray-400">Focus Mode Font Scale (%)</label>
                  <input
                    type="number"
                    min="90"
                    max="125"
                    step="5"
                    value={config.theme.defaultFontScale || 105}
                    onChange={(e) => updateThemeField("defaultFontScale", Number(e.target.value))}
                    className="w-full p-2.5 rounded-lg bg-[#090B10] border border-gray-700 text-sm text-white"
                  />
                </div>

                <div className="space-y-1.5">
                  <label className="block font-mono text-xs text-gray-400">Background Surface</label>
                  <select
                    value={config.theme.surfaceMode}
                    onChange={(e) => updateThemeField("surfaceMode", e.target.value)}
                    className="w-full p-2.5 rounded-lg bg-[#090B10] border border-gray-700 text-sm text-white"
                  >
                    <option value="obsidian">Deep Obsidian (#090B10)</option>
                    <option value="slate">Calm Dark Slate (#0D1117)</option>
                  </select>
                </div>
              </div>

              <div className="space-y-3 pt-2 border-t border-gray-800">
                <h3 className="font-mono text-sm font-bold text-gray-300">Per-Section Accent Colors</h3>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  {config.tabs.map((tab, idx) => (
                    <div key={tab.id} className="p-3 rounded-xl bg-[#090B10] border border-gray-800 flex items-center justify-between">
